# Supabase project config for DeadlineMate.
# `project_id` is your project ref — set with `supabase link` (it rewrites this).
project_id = "deadlinemate"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.pooler]
enabled = false

[realtime]
enabled = true

[studio]
enabled = true
port = 54323

[auth]
enabled = true
# The site URL your app is served from (Vercel prod domain). Local override below.
site_url = "http://localhost:5173"
# Every URL Supabase Auth is allowed to redirect back to after login.
additional_redirect_urls = [
  "http://localhost:5173/app/auth/callback",
  "https://deadlinemate.com/app/auth/callback",
]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = false   # magic-link flow; no password confirmation needed
double_confirm_changes = true

# Google OAuth — fill client id/secret via env when deploying.
[auth.external.google]
enabled = true
client_id = "env(SUPABASE_AUTH_GOOGLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_GOOGLE_SECRET)"
redirect_uri = ""

[edge_runtime]
enabled = true
# Edge functions are individually deployed with `supabase functions deploy`.

[functions.dispatch-reminders]
verify_jwt = false   # called by pg_cron with a shared secret, not a user JWT

[functions.import-calendar]
verify_jwt = true

[functions.sync-feeds]
verify_jwt = false   # called by pg_cron

[functions.stripe-webhook]
verify_jwt = false   # Stripe signs the payload; we verify the signature ourselves

[functions.stripe-checkout]
verify_jwt = true

[functions.stripe-portal]
verify_jwt = true
